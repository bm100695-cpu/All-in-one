services:
  - type: web
    name: all-in-one-backend
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    # Apply only committed, additive Prisma migrations before generating the
    # client. A migration failure stops deployment rather than letting the app
    # start against an unknown schema.
    buildCommand: npm install && npx prisma migrate deploy && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Production PostgreSQL connection is configured securely in Render;
        # never replace it with the local SQLite development path.
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      # Public Cashfree return/webhook destinations. Credentials remain
      # private server environment variables, never frontend configuration.
      - key: PUBLIC_APP_URL
        value: https://all-in-one-git-main-brijesh17.vercel.app
      - key: PUBLIC_API_URL
        value: https://all-in-one-japb.onrender.com
      - key: CASHFREE_WEBHOOK_URL
        value: https://all-in-one-japb.onrender.com/api/monetization/webhook/cashfree
