services:
  - type: web
    name: all-in-one-backend
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      # Public Cashfree return/webhook destinations. Credentials remain
      # private server environment variables, never frontend configuration.
      - key: PUBLIC_APP_URL
        value: https://all-in-one-git-main-brijesh17.vercel.app
      - key: PUBLIC_API_URL
        value: https://all-in-one-japb.onrender.com
