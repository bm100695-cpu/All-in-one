<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Clear any legacy Service Workers or caches from previous projects on this port
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All in One — Competitive & Teaching CBT Portal</title>
    <meta name="description" content="All in One: Authentic Computer-Based Test (CBT) simulator and Previous Year Question library for JEE Main, UPTET, SUPER TET, NEET & competitive exams." />
  </head>

  </body>
